<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bounty Tracker — Bug Bounty Program Dashboard</title>
<style>
:root{--bg:#0d1117;--surface:#161b22;--surface2:#1c2330;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#2f81f7;--green:#3fb950;--yellow:#d29922;--red:#f85149;--purple:#a371f7}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
header h1{font-size:1.4rem}header h1 span{color:var(--accent)}
.stats{display:flex;gap:12px;padding:20px 24px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 18px;min-width:130px}
.stat .n{font-size:1.6rem;font-weight:700}.stat .l{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.controls{display:flex;gap:10px;padding:0 24px 16px;flex-wrap:wrap}
input,select,textarea{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 12px;font-size:.9rem}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:.9rem;cursor:pointer;font-weight:600}
button:hover{filter:brightness(1.15)}button.ghost{background:var(--surface2);border:1px solid var(--border)}
button.danger{background:transparent;color:var(--red);border:1px solid var(--red);padding:6px 10px;font-size:.8rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;padding:0 24px 40px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;position:relative}
.card h3{font-size:1.05rem;margin-bottom:4px}.card h3 a{color:var(--text);text-decoration:none}.card h3 a:hover{color:var(--accent)}
.card .meta{font-size:.8rem;color:var(--muted);margin-bottom:10px}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.st-researching{background:#1c2a4a;color:#79b8ff}.st-hunting{background:#3a2f0b;color:#e3b341}.st-submitted{background:#2a1e4a;color:#c9a6f7}.st-paid{background:#0f3d1e;color:#56d364}.st-rejected{background:#3d1414;color:#ff7b72}.st-watchlist{background:#222;color:var(--muted)}
.reward{font-size:1.1rem;font-weight:700;color:var(--green);margin:8px 0}
.card .notes{font-size:.85rem;color:var(--muted);margin:8px 0;white-space:pre-wrap}
.card .actions{display:flex;gap:8px;margin-top:10px}
.card .auto{font-size:.75rem;margin-top:8px}.auto.yes{color:var(--green)}.auto.no{color:var(--red)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:10;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal .box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;width:100%;max-width:480px;max-height:90vh;overflow:auto}
.modal .box h2{margin-bottom:16px}
.field{margin-bottom:12px}.field label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{text-align:center;color:var(--muted);padding:60px 20px;grid-column:1/-1}
@media(max-width:600px){.grid{grid-template-columns:1fr}.row2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<h1>🎯 <span>Bounty</span> Tracker</h1>
<button onclick="openModal()">+ Add Program</button>
</header>
<div class="stats" id="stats"></div>
<div class="controls">
<input id="search" placeholder="🔍 Search programs..." oninput="render()" style="flex:1;min-width:200px">
<select id="filter" onchange="render()"><option value="">All statuses</option><option value="watchlist">Watchlist</option><option value="researching">Researching</option><option value="hunting">Hunting</option><option value="submitted">Submitted</option><option value="paid">Paid</option><option value="rejected">Rejected</option></select>
<button class="ghost" onclick="exportData()">Export</button>
<button class="ghost" onclick="document.getElementById('import').click()">Import</button>
<input type="file" id="import" accept=".json" style="display:none" onchange="importData(event)">
</div>
<div class="grid" id="grid"></div>
<div class="modal" id="modal"><div class="box">
<h2 id="mtitle">Add Program</h2>
<input type="hidden" id="f-id">
<div class="field"><label>Name *</label><input id="f-name" placeholder="e.g. CodeRabbit"></div>
<div class="row2">
<div class="field"><label>Platform</label><input id="f-platform" placeholder="HackerOne / Intigriti / Direct"></div>
<div class="field"><label>Status</label><select id="f-status"><option value="watchlist">Watchlist</option><option value="researching">Researching</option><option value="hunting">Hunting</option><option value="submitted">Submitted</option><option value="paid">Paid</option><option value="rejected">Rejected</option></select></div>
</div>
<div class="row2">
<div class="field"><label>Max Reward ($)</label><input id="f-reward" type="number" placeholder="5000"></div>
<div class="field"><label>Earned ($)</label><input id="f-earned" type="number" placeholder="0"></div>
</div>
<div class="row2">
<div class="field"><label>Automation Allowed?</label><select id="f-auto"><option value="unknown">Unknown</option><option value="yes">Yes</option><option value="no">No</option></select></div>
<div class="field"><label>Program URL</label><input id="f-url" placeholder="https://..."></div>
</div>
<div class="field"><label>Scope</label><input id="f-scope" placeholder="*.example.com"></div>
<div class="field"><label>Notes</label><textarea id="f-notes" rows="3" placeholder="Policy notes, findings, etc."></textarea></div>
<div style="display:flex;gap:10px;margin-top:16px"><button onclick="save()" style="flex:1">Save</button><button class="ghost" onclick="closeModal()">Cancel</button></div>
</div></div>
<script>
let data=JSON.parse(localStorage.getItem("bountyTracker")||"[]");
const $=id=>document.getElementById(id);
function save2(){localStorage.setItem("bountyTracker",JSON.stringify(data))}
function openModal(p){$("mtitle").textContent=p?"Edit Program":"Add Program";
["id","name","platform","status","reward","earned","auto","url","scope","notes"].forEach(k=>$("f-"+k).value=p?(p[k]||""):(k==="status"?"watchlist":k==="auto"?"unknown":""));
$("modal").classList.add("open")}
function closeModal(){$("modal").classList.remove("open")}
function save(){const name=$("f-name").value.trim();if(!name){alert("Name required");return}
const id=$("f-id").value;const obj={id:id||Date.now().toString(),name,platform:$("f-platform").value,status:$("f-status").value,reward:+$("f-reward").value||0,earned:+$("f-earned").value||0,auto:$("f-auto").value,url:$("f-url").value,scope:$("f-scope").value,notes:$("f-notes").value};
if(id){data=data.map(p=>p.id===id?obj:p)}else{data.push(obj)}
save2();closeModal();render()}
function del(id){if(confirm("Delete this program?")){data=data.filter(p=>p.id!==id);save2();render()}}
function edit(id){openModal(data.find(p=>p.id===id))}
function exportData(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="bounty-tracker.json";a.click()}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);save2();render()}catch{alert("Invalid file")}};r.readAsText(f)}
function render(){const q=$("search").value.toLowerCase(),f=$("filter").value;
const list=data.filter(p=>(!f||p.status===f)&&(!q||(p.name+p.platform+p.scope+p.notes).toLowerCase().includes(q)));
const totEarn=data.reduce((s,p)=>s+(+p.earned||0),0),totMax=data.reduce((s,p)=>s+(+p.reward||0),0);
const bySt={};data.forEach(p=>bySt[p.status]=(bySt[p.status]||0)+1);
$("stats").innerHTML=`<div class="stat"><div class="n">${data.length}</div><div class="l">Programs</div></div><div class="stat"><div class="n" style="color:var(--green)">$${totEarn.toLocaleString()}</div><div class="l">Earned</div></div><div class="stat"><div class="n">$${totMax.toLocaleString()}</div><div class="l">Max Potential</div></div><div class="stat"><div class="n">${bySt.hunting||0}</div><div class="l">Hunting</div></div><div class="stat"><div class="n">${bySt.submitted||0}</div><div class="l">Submitted</div></div>`;
$("grid").innerHTML=list.length?list.map(p=>`<div class="card"><h3>${p.url?`<a href="${p.url}" target="_blank">${p.name}</a>`:p.name}</h3><div class="meta">${p.platform||"—"}</div><span class="badge st-${p.status}">${p.status}</span><div class="reward">${p.earned?`+$${(+p.earned).toLocaleString()} earned · `:""}up to $${(+p.reward||0).toLocaleString()}</div>${p.scope?`<div class="meta">🎯 ${p.scope}</div>`:""}${p.notes?`<div class="notes">${p.notes}</div>`:""}${p.auto!=="unknown"?`<div class="auto ${p.auto}">${p.auto==="yes"?"✅":"⛔"} Automation ${p.auto}</div>`:""}<div class="actions"><button class="ghost" onclick="edit('${p.id}')">Edit</button><button class="danger" onclick="del('${p.id}')">Delete</button></div></div>`).join(""):`<div class="empty">No programs yet. Click <b>+ Add Program</b> to start tracking! 🎯</div>`}
document.querySelector(".modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
render();
</script>
</body>
</html>
